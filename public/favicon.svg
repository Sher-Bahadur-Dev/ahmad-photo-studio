<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfba73" />
      <stop offset="100%" stop-color="#c5a059" />
    </linearGradient>
    <radialGradient id="lensGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="70%" stop-color="#0e1017" />
      <stop offset="100%" stop-color="#0b0c10" />
    </radialGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="64" height="64" rx="14" fill="#0b0c10" stroke="#262b3a" stroke-width="1.5"/>
  
  <!-- Camera Body -->
  <rect x="12" y="20" width="40" height="28" rx="6" fill="#141722" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Camera Top Pentaprism / Flash Bump -->
  <path d="M24 20 L27 14 L37 14 L40 20 Z" fill="#141722" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linejoin="round"/>
  
  <!-- Shutter Button -->
  <rect x="16" y="16" width="5" height="3" rx="1" fill="url(#goldGrad)"/>
  
  <!-- Small Sensor / Flash Light -->
  <circle cx="45" cy="26" r="2" fill="#c5a059"/>
  
  <!-- Lens Outer Ring -->
  <circle cx="32" cy="34" r="11" fill="url(#lensGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Lens Inner Aperture Ring -->
  <circle cx="32" cy="34" r="6.5" fill="none" stroke="#c5a059" stroke-width="1" stroke-dasharray="2 1.5"/>
  
  <!-- Lens Reflection Highlight -->
  <path d="M28 30 A5 5 0 0 1 34 30" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
